# 本地写作链路：posts/*.md → GitHub Issue → 博客页面（见 scripts/sync_local_posts.py）
name: build Gmeek

on:
  workflow_dispatch:
  issues:
    # closed / deleted 也要触发：在 GitHub 上关闭或删除一篇文章的 Issue，
    # 博客几分钟内就会把它下线（这两个事件走全量重建，见下面的 Generate 步骤）
    types: [opened, edited, closed, deleted]
  push:
    branches: [main]
    paths:
      - "config.json"
      - "data/**"
      - "posts/**"
      - "static/**"
      - "scripts/**"
      # widgets/** 是看板娘等页面组件的源文件，由 scripts/sync_refreshment.py 注入到 docs/。
      # 不加这一行，单独改组件时 push 不会触发构建。
      - "widgets/**"
      - ".github/workflows/Gmeek.yml"
  schedule:
    - cron: "0 16 * * *"
    
jobs:
  build:
    name: Generate blog
    runs-on: ubuntu-24.04
    concurrency:
      group: gmeek-build
      cancel-in-progress: true
    if: ${{ github.event.repository.owner.id == github.event.sender.id || github.event_name == 'schedule' }}
    permissions: write-all
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1          # 只取最新一次提交，仓库历史有 190MB+，全量拉太慢

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Get config.json
        run: |
          echo "====== check config.josn file ======"
          cat config.json
          echo "====== check config.josn end  ======"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.8

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-gmeek-${{ hashFiles('config.json') }}
          restore-keys: |
            ${{ runner.os }}-pip-gmeek-

      - name: Clone source code
        run: |
          GMEEK_VERSION=$(python -c "import json;print(json.load(open('config.json')).get('GMEEK_VERSION','last'))")
          git clone https://github.com/Meekdai/Gmeek.git /opt/Gmeek;
          cd /opt/Gmeek/
          lastTag=$(git describe --tags `git rev-list --tags --max-count=1`)
          if [ $GMEEK_VERSION == 'last' ]; then git checkout $lastTag; else git checkout $GMEEK_VERSION; fi;

      - name: Patch Gmeek (markdown cache & rate limit)
        run: python scripts/patch_gmeek_md_cache.py /opt/Gmeek/Gmeek.py

      # GitHub 的 issues 列表接口换成了游标分页，翻到第 2 页起返回空，
      # Gmeek 的 runAll() 只能拿到最近约 300 个 issue，更老的整批消失
      # （2026-10-22 事故：个人页面 / 日日新 / 莫斯科生存攻略 三个板块 404，
      #  文章从 510 篇掉到 59 篇）。这一步让它按编号把缺口补齐，并在数量骤降时中止构建。
      - name: Patch Gmeek (issue paging)
        run: python scripts/patch_gmeek_issue_paging.py /opt/Gmeek/Gmeek.py

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r /opt/Gmeek/requirements.txt

      - name: Sync 本地文章 → Issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SITE_BASE_URL: https://russianqin.github.io
        run: python scripts/sync_local_posts.py publish

      # 上一步刚关掉的 Issue，如果紧接着就拉列表，会撞上 GitHub issues 接口的几秒缓存：
      # 缓存里它还是 open，于是被当成正常文章重建，列表页继续显示（2026-10-23 的 #529 就是这样
      # 活下来的 —— 它和 #528 相隔 1 秒关闭，#528 的缓存已过期被正确排除，#529 没有）。
      # 停 15 秒让缓存过期，比事后手工再触发一次构建省事。
      - name: Cool down before rebuild
        run: sleep 15

      - name: Generate new html
        env:
          GMEEK_MD_CACHE_DIR: ${{ github.workspace }}/.md-cache
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          mkdir -p docs
          cp -r ./* /opt/Gmeek/
          cd /opt/Gmeek/
          # opened / edited 只更新那一篇；closed / deleted 等情况走全量重建
          # （Gmeek 的 runOne 对已关闭的 Issue 什么都不做，必须走 runAll 才能把文章下线）
          ISSUE_NUMBER=0
          if [ "$EVENT_ACTION" = "opened" ] || [ "$EVENT_ACTION" = "edited" ]; then
            ISSUE_NUMBER="$EVENT_ISSUE_NUMBER"
          fi
          echo "Gmeek 参数：issue_number=$ISSUE_NUMBER（事件=$EVENT_ACTION）"
          python Gmeek.py ${{ secrets.GITHUB_TOKEN }} ${{ github.repository }} --issue_number "$ISSUE_NUMBER"
          cp -a /opt/Gmeek/docs ${{ github.workspace }} 
          cp -a /opt/Gmeek/backup ${{ github.workspace }} 
          cp /opt/Gmeek/blogBase.json ${{ github.workspace }} 

      - name: Sync 日日新 page
        run: python scripts/sync_refreshment.py docs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Sync 释略大典 page
        run: python scripts/sync_shilue.py docs

      - name: Checkout 收藏仓库（私有，只读）
        uses: actions/checkout@v4
        with:
          repository: russianqin/WenZhangShouCang
          token: ${{ secrets.WZSC_TOKEN }}
          path: .wzsc-source
          fetch-depth: 1
          persist-credentials: false

      - name: Sync 文章收藏 (Curated Articles)
        run: python scripts/sync_curated.py docs --source .wzsc-source --images download

      - name: Sync 读书心得 (Reading)
        run: python scripts/sync_reading.py docs

      - name: Sync 本地文章图片
        env:
          SITE_BASE_URL: https://russianqin.github.io
        run: python scripts/sync_local_posts.py assets docs

      - name: Sync 色廊 page
        run: python scripts/sync_gallery.py docs

      # 四个主题板块（BTC / 外文 / 薄肌 / 自媒体）。归类清单在 data/topics.json，
      # 脚本只读 blogBase.json + 清单，**不发任何网络请求**；页面必须在这一步生成，
      # 手工塞进 docs/ 会被 Gmeek 的 docs 覆盖冲掉。
      # 必须排在 optimize_docs 之前，好让新页也进 sitemap、也做图片懒加载。
      - name: Sync 主题板块 page
        run: python scripts/sync_topics.py docs

      - name: Optimize docs (SEO / 图片懒加载 / sitemap)
        run: python scripts/optimize_docs.py docs

      - name: 体检 head 里的裸文本
        run: |
          set +e
          output=$(python scripts/check_head.py docs)
          code=$?
          echo "$output"
          {
            echo "## head 裸文本体检"
            echo ""
            echo '```'
            echo "$output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: 体检收藏页隐藏状态
        run: |
          set +e
          output=$(python scripts/check_curated_visibility.py docs)
          code=$?
          echo "$output"
          {
            echo "## 收藏页隐藏体检"
            echo ""
            echo '```'
            echo "$output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $code
          
      - name: update html
        run: |
          # config.json 里没有 email 字段（老写法 jq 会返回字符串 "null"），这里给个正经兜底
          EMAIL=$(python -c "import json;print(json.load(open('config.json')).get('email') or '')")
          git config --local user.email "${EMAIL:-${{ github.repository_owner }}@users.noreply.github.com}"
          git config --local user.name "${{ github.repository_owner }}"
          git add .
          git commit -a -m '🎉auto update by Gmeek action' || echo "nothing to commit"
          git push || echo "nothing to push"
          sleep 3
          
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/.'
          
  deploy:
    name: Deploy blog
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      contents: write
      pages: write
      id-token: write
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
