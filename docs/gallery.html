ref="/gallery-images/%D0%9C%D0%B0%D1%80%D0%B8%D1%8F-01.png" data-name="Мария-01"><img src="/gallery-images/%D0%9C%D0%B0%D1%80%D0%B8%D1%8F-01.png" alt="Мария-01" loading="lazy" decoding="async"></a><a class="gallery-item" href="/gallery-images/%D0%9E%D0%BB%D1%8C%D0%B3%D0%B0-01.png" data-name="Ольга-01"><img src="/gallery-images/%D0%9E%D0%BB%D1%8C%D0%B3%D0%B0-01.png" alt="Ольга-01" loading="lazy" decoding="async"></a><a class="gallery-item" href="/gallery-images/%D0%9E%D0%BB%D1%8C%D0%B3%D0%B0-02.png" data-name="Ольга-02"><img src="/gallery-images/%D0%9E%D0%BB%D1%8C%D0%B3%D0%B0-02.png" alt="Ольга-02" loading="lazy" decoding="async"></a><a class="gallery-item" href="/gallery-images/%D0%AF%D0%BD%D0%B0-01.png" data-name="Яна-01"><img src="/gallery-images/%D0%AF%D0%BD%D0%B0-01.png" alt="Яна-01" loading="lazy" decoding="async"></a></div>

<script>(function(){
  var grid = document.getElementById("galleryGrid");
  if (!grid) return;
  var sentinel = document.getElementById("gallerySentinel");
  var dataEl = document.getElementById("galleryData");
  var rest = dataEl ? JSON.parse(dataEl.textContent || "[]") : [];
  var PER = 48;
  var cursor = 0;
  /* 序号按「总数」显示，而不是「已渲染数」：滚到一半点开时不该出现 37 / 96 这种怪数字 */
  var total = parseInt(grid.getAttribute("data-total"), 10) || 0;

  function makeItem(url, name){
    var a = document.createElement("a");
    a.className = "gallery-item";
    a.href = url;
    a.setAttribute("data-name", name);
    var img = document.createElement("img");
    img.src = url;
    img.alt = name;
    img.loading = "lazy";
    img.decoding = "async";
    a.appendChild(img);
    return a;
  }

  function loadMore(){
    if (!sentinel || cursor >= rest.length) return;
    var frag = document.createDocumentFragment();
    var end = Math.min(cursor + PER, rest.length);
    for (var i = cursor; i < end; i++) frag.appendChild(makeItem(rest[i][0], rest[i][1]));
    grid.appendChild(frag);
    cursor = end;
    if (cursor >= rest.length) sentinel.parentNode.removeChild(sentinel);
  }

  if (sentinel && rest.length){
    sentinel.textContent = "向下滚动加载更多…";
    if ("IntersectionObserver" in window){
      var io = new IntersectionObserver(function(entries){
        for (var i = 0; i < entries.length; i++){
          if (entries[i].isIntersecting){ loadMore(); break; }
        }
      }, { rootMargin: "800px 0px" });
      io.observe(sentinel);
    } else {
      sentinel.addEventListener("click", loadMore);
    }
  }

  /* ---- 灯箱 ---- */
  var viewer = document.getElementById("galleryViewer");
  var big = document.getElementById("galleryViewerImg");
  var counter = document.getElementById("galleryViewerCount");
  if (!viewer || !big) return;
  var current = -1;

  function items(){ return [].slice.call(grid.querySelectorAll("a.gallery-item")); }

  function show(index){
    var list = items();
    if (!list.length) return;
    /* 往后翻到还没渲染的区域：先补一批，而不是直接绕回第一张 */
    if (index >= list.length && cursor < rest.length){
      loadMore();
      list = items();
    }
    if (index < 0){
      if (cursor < rest.length) loadMore();
      list = items();
      index = list.length - 1;
    }
    if (index >= list.length) index = 0;
    current = index;
    var link = list[index];
    big.src = link.getAttribute("href");
    big.alt = link.getAttribute("data-name") || "";
    if (counter) counter.textContent = (index + 1) + " / " + (total || list.length);
    viewer.classList.add("show");
    document.body.classList.add("gallery-viewer-open");
  }

  function hide(){
    viewer.classList.remove("show");
    document.body.classList.remove("gallery-viewer-open");
  }

  grid.addEventListener("click", function(event){
    var link = event.target.closest ? event.target.closest("a.gallery-item") : null;
    if (!link) return;
    event.preventDefault();
    /* 拦住冒泡：否则 custom.js 的通用灯箱会再弹一层 */
    event.stopPropagation();
    var list = items();
    show(list.indexOf(link));
  });

  document.getElementById("galleryViewerClose").addEventListener("click", hide);
  document.getElementById("galleryViewerNext").addEventListener("click", function(e){ e.stopPropagation(); show(current + 1); });
  document.getElementById("galleryViewerPrev").addEventListener("click", function(e){ e.stopPropagation(); show(current - 1); });
  /* 点大图本身不关闭（很多人习惯性点一下图），关闭走遮罩 / 关闭按钮 / Esc。
     同时要 stopPropagation，否则事件冒到 document 会被 custom.js 的通用灯箱接走。 */
  big.addEventListener("click", function(event){ event.stopPropagation(); });
  viewer.addEventListener("click", function(event){
    if (event.target === viewer) hide();
  });

  document.addEventListener("keydown", function(event){
    if (!viewer.classList.contains("show")) return;
    if (event.key === "Escape") hide();
    else if (event.key === "ArrowLeft") show(current - 1);
    else if (event.key === "ArrowRight") show(current + 1);
  });

  var touchX = null;
  viewer.addEventListener("touchstart", function(e){
    if (e.touches.length === 1) touchX = e.touches[0].clientX;
  }, { passive: true });
  viewer.addEventListener("touchend", function(e){
    if (touchX === null) return;
    var endX = e.changedTouches.length ? e.changedTouches[0].clientX : touchX;
    var delta = endX - touchX;
    touchX = null;
    if (Math.abs(delta) < 45) return;
    show(current + (delta < 0 ? 1 : -1));
  });
})();</script>

<script>
/* --- 看板娘弹窗（与史略页同构：洗牌 + 懒预加载 + 键盘翻页） --- */
(function(){
  var PRELOAD=3;

  var modal=document.getElementById('ririModal');
  var openBtn=document.getElementById('ririKanbanBtn');
  if(!modal||!openBtn){return;}

  var img=document.getElementById('ririModalImg');
  var closeBtn=document.getElementById('ririModalClose');
  var navBox=document.getElementById('ririModalNav');
  var prevBtn=document.getElementById('ririModalPrev');
  var nextBtn=document.getElementById('ririModalNext');
  var countEl=document.getElementById('ririModalCount');
  var shot=openBtn.getAttribute('data-images')||'';
  var pool=shot?shot.split(',').filter(Boolean):[];   /* 图池（固定顺序，别动） */
  var list=[];                                        /* 本次打开的洗牌结果 */
  var idx=0;
  var preloaded={};
  var lastFirst=null;

  /* 图池为空时按钮不响应，避免打开空白弹窗；填入 data-images 后自动生效 */
  if(!pool.length){openBtn.disabled=true;openBtn.style.opacity='.45';return;}

  /* Fisher–Yates 洗牌，返回新数组，不改动 pool */
  function shuffled(src){
    var a=src.slice();
    for(var i=a.length-1;i>0;i--){
      var j=Math.floor(Math.random()*(i+1));
      var t=a[i];a[i]=a[j];a[j]=t;
    }
    return a;
  }
  /* 懒预加载：翻到哪预取到哪 */
  function prime(from,count){
    for(var i=from;i<from+count&&i<list.length;i++){
      if(preloaded[list[i]]){continue;}
      preloaded[list[i]]=1;
      var p=new Image();p.src=list[i];
    }
  }
  function render(){
    if(!list.length){return;}
    img.src=list[idx];
    img.alt='看板娘 '+(idx+1);
    var multi=list.length>1;
    navBox.classList.toggle('riri-modal-nav-show',multi);
    if(multi){
      countEl.textContent=(idx+1)+' / '+list.length;
      prevBtn.disabled=(idx===0);
      nextBtn.disabled=(idx===list.length-1);
    }
    /* 当前张 + 后面 PRELOAD 张 */
    prime(idx,PRELOAD);
  }
  function open(){
    if(!pool.length){return;}
    /* 每次点开都重新洗牌；若首张与上次相同且不止一张，再抽一次，
       避免"随机了但看着没变" */
    var next=shuffled(pool);
    if(pool.length>1&&next[0]===lastFirst){
      next=shuffled(pool);
    }
    lastFirst=next[0];
    list=next;idx=0;render();
    modal.classList.add('riri-modal-open');
    document.body.style.overflow='hidden';
  }
  function close(){
    modal.classList.remove('riri-modal-open');
    document.body.style.overflow='';
  }
  function go(step){
    var n=idx+step;
    if(n<0||n>=list.length){return;}
    idx=n;render();
  }
  openBtn.addEventListener('click',open);
  closeBtn.addEventListener('click',close);
  prevBtn.addEventListener('click',function(e){e.stopPropagation();go(-1);});
  nextBtn.addEventListener('click',function(e){e.stopPropagation();go(1);});
  modal.addEventListener('click',function(e){if(e.target===modal){close();}});
  document.addEventListener('keydown',function(e){
    if(!modal.classList.contains('riri-modal-open')){return;}
    if(e.key==='Escape'){close();}
    else if(e.key==='ArrowLeft'){go(-1);}
    else if(e.key==='ArrowRight'){go(1);}
  });
  /* 首次打开前不预加载任何图，避免首屏白下几百 KB；
     打开时 render() 会按洗牌结果取前 PRELOAD 张。 */
})();
</script>
