<p>《三千美娇娘》</p>
<p>主人公是背靠时代巨流，周旋于顺、明、清、杂各路人马之间的顺朝河南登封县七品知县白云航。</p>
<p>全篇使用早慢熊《新顺》的架空世界观，使得作者可以将笔力全部输出在情节上，再在各种“不经意间”慢慢露出一丝丝顺朝肇建的来龙去脉，读者会逐渐发现，明末历史发展偏离主时空的第一推动力来自顺朝高层一名叫做“程系”的疑似穿越者，此人在文中从未与主角照面，但是屡屡在时代的浪潮中搅动风云，享受着超主角待遇。</p>
<p>《新顺》的设定谨严细致，然而直到《三千美娇娘》完本十多年后的今天，依然是个大坑……</p>
