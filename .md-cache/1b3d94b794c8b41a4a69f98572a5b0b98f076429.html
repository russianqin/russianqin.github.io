<p>1月7日晚上去了杭州，准备8日早晨与下午的在职研究生专业课笔试与面试。<br>
过程不表了，GCT成绩我是第一，笔试交卷我是第一，面试顺序我是第二。真是简单明快，我喜欢这个效率，除了那张通讯试题我几乎都没看懂以外，完美。<br>
考试结束，和在杭的基友X看了《原力觉醒》，然后打《星际争霸2》到12点，关电睡觉。真是个愉快的周末。（迄今为止，已经打废了星际2的两张图，意即，用这2张图打电脑，怎样都不会输。）<br>
期间，曾吃了一顿湖州大馄饨，惊艳，好吃，下次有机会再常常。毕竟，假使录取，就会有大把的机会去杭州浪了。</p>
