<p>任峻，典农中郎将，被曹操委以屯田的方面之任。</p>
<p>人过中年，会将对英雄的崇拜深藏内心，更多着眼于柴米油盐的算计。站在一个普通干部的角度，能够像任峻一样，在创业之初就报上时代洪流中最粗的大腿，在后方兢兢业业地种田发展，辅佐大腿变成大粗腿，积功至二千石，光耀门楣并成就三不朽，后世讨论三国时代的经济都绕不过哥的名字，多么令人羡慕且值得效仿的升职路径啊。</p>
