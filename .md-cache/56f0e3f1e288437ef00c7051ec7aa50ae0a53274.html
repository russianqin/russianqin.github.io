<p>《原毁》：“古之君子，其责己也重以周，其待人也轻以约。”<br>
勉强做到了第二条，离第一条还差得很远，庶几“怠与忌之谓也”！</p>
<p>《杂说四》。<br>
只能说字字珠玑，没得评。“辱于奴隶人之手，骈死于槽枥之间”的英雄豪杰有多少呢？数不清，但能脱颖而出的，一定是其中最闪光的那些。这在某种意义上也符合进化论的观点。</p>
<p>《进学解》。<br>
真好文采。当得上“韵致铿锵、对偶工切、辞采华茂、韵白交错”。自嘲良作，应当背诵全文。</p>
