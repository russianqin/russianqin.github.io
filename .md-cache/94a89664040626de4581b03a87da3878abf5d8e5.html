<ol>
<li>从心态上来说，最大的阻碍是“认为学英语存在阻碍”。</li>
</ol>
<p>这个不多展开了。就像没有人会问“学汉语最大的阻碍是什么？”</p>
<p>因为其实并不存在什么“大”阻碍。</p>
<p>2.从方法上来说，最大的阻碍是“为了学英语而学英语”。</p>
<p>为了学习（专业知识而非英语本身）、赚钱、娱乐、泡妞……随便什么理由都行，抱定一个目标、为了解决一个具体问题去学习英语，总会得到肉眼可见的进步。</p>
<p>若只是为学而学，那就悬了。非只英语，任何技能都是这样。</p>
