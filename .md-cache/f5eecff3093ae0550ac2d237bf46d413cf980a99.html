<p>有一个画面我记忆犹新，是大刘在《球状闪电》中描写丁仪形象的：“……在周围这些穿军装的人中，丁仪显得鹤立鸡群，在草原上吹来的热乎乎的夏风中，<strong>他似乎是由三面旗帜组成的，一面是他的飘动的长头发，另外两面分别是他那过分宽大的背心和短裤，被风吹得鼓动不已，他麻秆似的瘦长身条就如同一根串起三面旗帜的旗杆。</strong>”</p>

<p>就感觉吧，风可能吹不起王传君那蓬松的头发，不够长也不够柔顺。身段或许也不够麻秆。</p>
