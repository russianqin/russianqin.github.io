<p>浮生中几次风波<br>
尘世里几番福祸<br>
谁可躲叹一切随缘<br>
不知道未来有甚么<br>
无谓去推测结果<br>
无谓记花放花堕<br>
珍惜这一刻<br>
投入美梦中<br>
唱尽欢笑歌<br>
无谓记住苦楚</p>
