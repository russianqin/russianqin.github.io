<p>起卦：</p>
<p>《升》之《师》：“升虚邑。”</p>
<p>解卦：</p>
<p>升虚邑。无所疑也。</p>
<p>蒋方舟此举，自有其来龙去脉。《升》卦九三爻辞“升虚邑”，可解为“登临殷墟（虚）之城邑”，恰应此景。</p>
<p>2010年来，中日国势逆转，犹如殷周革命，蒋方舟东渡，正是前往“虚邑”。这件事本身，经得起推敲。但对中国民众，尤其是蒋的读者来说，这《东京一年》的好坏，实在值得商榷。</p>
