<p>图为办公室的彩打机。<br>
每次写完PPT用它打出来，都会有种喝猛了酒然后呕出污物来的奇妙快感。<br>
年底写材料，心态就会变得很奇怪。<br>
一方面，我觉得这些都是辣鸡，把人类的智力浪费在这种时效性极差的官样八股里，所以总是拖拖拉拉，效率超低；另一方面，又总能在死线前一天战斗力爆表地把它写完，然后凭借这份功力享受比其他同事更优越的职业通道。<br>
很矛盾。我对自己的认识，还有很多提升的空间；认识自我，然后才能改造自我。<br>
明天要早起啊，晚上构思了新游戏稿的思路，完成了一半。希望在明天上班前写完全篇。</p>
