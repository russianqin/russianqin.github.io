<p>人总会纠缠于沉没成本，根据过去投入了多少，来决定当下要不要放弃。</p>
<p>从决策合理性上来说，这是非常荒谬的。</p>
<p>坚持一件事的理由有很多，但如果只是因为舍不得此前的投入，这就肯定不是一个好理由。当前形势和对未来的评估才是最重要的。</p>
<p>为什么会有这种荒谬的纠结？</p>
<p>因为我们总是试图表现得坚韧，在外界看来这是一个积极的信号。</p>
<p>因为我们总是害怕矛盾，如果中途放弃，那就是主动制造了一个矛盾。</p>
<p>因为我们总是避免承认，从前的想法和今天不同。无意义的坚持可以延迟这种“痛的领悟”。</p>
