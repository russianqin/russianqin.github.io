<p>勤劳难以致富，它只能让你脱离贫穷。</p>
<p>但脱离贫穷就已经让你的生活质量超越多数人了。</p>
<p>所以，还是要勤劳，或者换个不那么土的说法，要努力奋斗。</p>
<p>但努力的成果是有上限的，每天拼命洗20个小时的碗，也永远不会发财。</p>
<p>所以在努力的基础上，比起瞎忙，理解和思考才是更重要的。要选择正确的方向，明白到哪个赛道上去努力、和谁一起努力，以及努力的时机。</p>
<p>雷军曾经告诫人们，“不要用战术上的勤奋，掩盖战略上的懒惰”</p>
<p>就是这个道理。</p>
