<p>为油男卜一卦。</p>
<p><strong>《中孚》之《小畜》：</strong></p>
<p><strong>“得敌，或鼓或罢，或泣或歌。”</strong></p>
<p><strong>敌，网红是油腻的匹敌。</strong></p>
<p><strong>鼓，《说文》注“郭也。春分之音，萬物郭皮甲而出，故謂之鼓。”“郭者，覆冒之意。”</strong></p>
<p>听到有什么东西要满出来了，春分之音，根本就是JingChong上脑之音。</p>
<p><strong>罢，（罷），从罒从能。“言有賢能而入罔，卽貰遣之。”</strong></p>
<p>哦贤能，一校之长，入于罔中。四载施舍，一朝闹翻。</p>
<p><strong>泣，無聲出涕曰泣。</strong></p>
<p><strong>歌，長引其聲以詠也。</strong></p>
<p>“子于是日哭，则不歌。”哭与歌，是不得两立的，网红与油腻也将不得两立。</p>
