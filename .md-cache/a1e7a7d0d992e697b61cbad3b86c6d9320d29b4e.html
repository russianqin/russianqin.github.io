<p>起卦：</p>
<p>《临》之《归妹》：“至临，无咎。”</p>
<p>解卦：</p>
<p>至临，无咎。林志玲没事儿。</p>
<p>至临无咎，位当也。</p>
<p>“临”字本义是以上视下，以尊对卑。近日，大陆疫苗入台风波不断，岛内疫情却愈发危急，真是太监不急皇帝急。可毕竟大陆之“临”的动作还在，台湾目前不会出大乱子。</p>
<p>《临》卦的本卦卦辞很具体，“至于八月，有凶。”今年夏历八月对应的公历从9月7日开始，让我们静观其变，看看卦辞是否有征。</p>
