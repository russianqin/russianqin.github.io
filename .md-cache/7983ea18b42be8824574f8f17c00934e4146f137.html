<p>一碗牛肉烩面，这是今天的晚饭。当时忘记拍照了，上图来自网络。<br>
中午和许久没见的小夏一起吃了旺美茶餐厅，这是当地少有的我俩都觉得味道不错的平价馆子。<br>
下午在西区折腾良久，逛书店半晌不知道买啥，想去看电影，手机摔了一下，团购App登录后老出毛病，最后不情不愿来到办公室。<br>
鬼使神差地下载了叫兽的《万万没想到》，跳着看完，2星。<br>
尝试着打开年总结的文档，没写100个字，烦躁地关了。又发白日梦般地检讨起人生。<br>
饿了，在拉面店里吃了烩面。<br>
消灭了印象笔记里所有的阅读类文章。</p>
